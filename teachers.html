<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A Card from Charlotte — Choose your name</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #f7f1e3; color: #4a3826;
    font-family: Georgia, 'Times New Roman', serif; }
  .wrap { max-width: 430px; margin: 0 auto; padding: 36px 22px 44px; text-align: center; }
  .card { background: #fffdf6; border: 2px solid #c9a227; border-radius: 14px;
    padding: 30px 20px 26px; box-shadow: 0 6px 24px rgba(90, 70, 20, .15); }
  h1 { font-size: 25px; margin: 0 0 8px; font-weight: normal; }
  p.sub { font-size: 16px; line-height: 1.45; margin: 0 0 24px; color: #6b543a; }
  a.teacher { display: flex; align-items: center; gap: 16px; text-decoration: none;
    background: #fdf6e0; border: 1.5px solid #c9a227; border-radius: 999px;
    padding: 10px 22px 10px 10px; margin: 0 auto 16px; max-width: 320px;
    color: #4a3826; box-shadow: 0 3px 10px rgba(90, 70, 20, .12); }
  a.teacher:active { transform: scale(.98); }
  a.teacher img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
    border: 2px solid #c9a227; background: #fff; }
  a.teacher span { font-size: 20px; }
  .soon { opacity: .55; }
  .soon span::after { content: " — coming soon"; font-size: 14px; }
  p.note { font-size: 13px; opacity: .7; margin-top: 22px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>A card from Charlotte ✨</h1>
    <p class="sub">Tap your name, then point your phone camera at your storybook card — and watch Charlotte's thank-you come alive.</p>
    <a class="teacher" href="./stephanie.html"><img src="./cartoon-stephanie.webp" alt="Madame Stéphanie"><span>Madame Stéphanie</span></a>
    <a class="teacher" href="./zelie.html"><img src="./cartoon-zelie.webp" alt="Madame Zélie"><span>Madame Zélie</span></a>
    <p class="note">Your camera is only used to see the card.<br>Nothing is recorded or sent anywhere.</p>
  </div>
</div>
</body>
</html>
